upstream backend  { server backend:3001;  keepalive 32; }
upstream frontend { server frontend:80; }

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ws:10m  rate=5r/m;

server {
    listen 80;
    server_name echo-core.ru www.echo-core.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name echo-core.ru www.echo-core.ru;

    ssl_certificate     /etc/letsencrypt/live/echo-core.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echo-core.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           no-referrer always;

    server_tokens off;

    location /api/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /healthz/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    location /ws {
        limit_req zone=ws burst=3 nodelay;
        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
